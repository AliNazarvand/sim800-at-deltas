name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tools/validate.py
      - run: python tools/validate_yaml.py --strict

  regenerate-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tools/generate_cpp.py
      - run: python tools/export_markdown.py
      - run: git diff --exit-code include/simcom/simcom_database.hpp docs/DATABASE_REFERENCE.md

  fuzz-smoke:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - run: |
          cmake -S . -B build-fuzz -DSIMCOM_ENABLE_FUZZING=ON -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fuzz